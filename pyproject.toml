[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ffsi"
version = "0.1.0"
dependencies = [
    "setuptools",
    "numpy",
    "scipy",
    "galahad-optrove"
]
requires-python = ">=3.10"
authors = [
    {name = "Jaroslav Fowkes", email = "jaroslav.fowkes@maths.ox.ac.uk"}
]
maintainers = [
    {name = "Jaroslav Fowkes", email = "jaroslav.fowkes@maths.ox.ac.uk"}
]
description = "A package for the free-form inversion of Small Angle Scattering problems arising from X-ray and Neutron sources"
readme = "README.md"
license = {text = "BSD-3-Clause"}
keywords = ["physics", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: GPU",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",  
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics "
]

[project.urls]
Homepage = "https://github.com/ralna/free-form-sas-inversion/"
Download = "https://github.com/ralna/free-form-sas-inversion/releases/"
"Bug Tracker" = "https://github.com/ralna/free-form-sas-inversion/issues/"
Documentation = "https://ralna.github.io/free-form-sas-inversion/"
"Source Code" = "https://github.com/ralna/free-form-sas-inversion/"

[tool.setuptools]
packages = ["ffsi"]
